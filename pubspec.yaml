name: embed_webview
description: An auto-height webview widget for Flutter that adapts its size using ResizeObserver. Supports Android, iOS, macOS, Windows, and Web.
version: 0.1.0
homepage: https://github.com/jixiaoyong/embed_webview
# publish command: dart pub publish --server=https://pub.dev

environment:
  sdk: "^3.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  # webview core (automatically delegates to platform implementations)
  webview_flutter: ^4.10.0
  webview_flutter_wkwebview: ^3.16.0
  webview_flutter_web: ^0.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  webview_flutter_platform_interface: ^2.14.0

flutter:
